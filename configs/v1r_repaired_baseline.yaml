model:
  model_name: efficientnet_b0
  image_size: 384
  pretrained: true

training:
  epochs: 4
  learning_rate: 0.0001
  loss: weighted_bce
  weighted_sampler: false
  augmentation_recipe: mild_safe
  split_source: v2b_compatible
  save_validation_predictions: true
  save_test_predictions: false
  threshold_selection: validation_f1_binary_pos_label_1

output:
  output_root: outputs/kaggle_v1r/v1r_repaired_baseline
