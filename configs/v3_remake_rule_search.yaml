paths:
  v2b_val_predictions: artifacts/kaggle_v2b_artifacts/kaggle_v2/v2b_effnet_b1/kaggle_v2/predictions/val_classifier_predictions.csv
  v2b_test_submission: artifacts/kaggle_v2b_artifacts/kaggle_v2/v2b_effnet_b1/submissions/submission_v2b.csv
  v2b_threshold: artifacts/kaggle_v2b_artifacts/kaggle_v2/v2b_effnet_b1/kaggle_v2/reports/best_threshold.json
  detector_val_predictions: artifacts/krones_v3_yolov8n_50epoch_artifacts/val_detector_binary_predictions.csv
  detector_test_predictions: artifacts/krones_v3_yolov8n_50epoch_artifacts/test_detector_predictions.csv
  category_mapping: artifacts/krones_v3_yolov8n_50epoch_artifacts/reports/category_mapping.json
  train_csv: 1st-krones-vision-ai-challenge/train.csv
  sample_submission: 1st-krones-vision-ai-challenge/sample_submission.csv
  output_root: outputs/hybrid/v4_remake

search:
  detector_conf_thresholds:
    - 0.10
    - 0.15
    - 0.20
    - 0.25
    - 0.30
    - 0.35
  uncertainty_margins:
    - 0.02
    - 0.04
    - 0.06
    - 0.08
    - 0.10
    - 0.12
  conditional_area_threshold: 0.05
  f1_tie_tolerance: 0.002

safety:
  max_changed_ratio_without_f1_gain: 0.15
  max_target1_distribution_shift: 0.08
  max_precision_drop: 0.05
  minimum_clear_f1_gain: 0.002
