  v2b_predictions_path: artifacts/kaggle_v2b_artifacts/kaggle_v2/v2b_effnet_b1/kaggle_v2/predictions/val_classifier_predictions.csv
  image_embeddings_path: outputs/analysis/data_quality_audit/image_embeddings.csv
  cleanlab_scores_path: ""
  cluster_assignments_path: ""

dataset:
  train_csv_path: 1st-krones-vision-ai-challenge/train.csv
  train_images_dir: 1st-krones-vision-ai-challenge/train_images

output:
  analysis_root: outputs/analysis/data_quality_decision_lock

quality:
  label_issue_threshold: 0.80
  prediction_high_risk_threshold: 0.75
  prediction_critical_risk_threshold: 0.90
  contact_sheet_limit: 64
  adjudication_queue_limit: 800

safety:
  allow_test_labels: false
  public_leaderboard_input: false
  generate_submission: false
  train_model: false
  apply_relabels: false
