  spec016_cleaned_manifest_path: outputs/analysis/data_quality_audit/cleaned_training_manifest.csv
  spec016_manual_review_required_path: outputs/analysis/data_quality_audit/manual_review_required_rows.csv
  spec016_review_template_path: outputs/analysis/data_quality_audit/review_decision_template.csv
  spec016_summary_path: outputs/analysis/data_quality_audit/reports/data_quality_summary.json
  spec016_exclusion_reasons_path: outputs/analysis/data_quality_audit/reports/exclusion_reason_counts.csv
  spec014_allowed_hard_rows_path: outputs/analysis/hard_row_visual_review/reports/phase3_allowed_hard_training_rows.csv
  spec014_blocked_roi_pipeline_bug_rows_path: outputs/analysis/hard_row_visual_review/reports/blocked_roi_pipeline_bug_rows.csv
  spec014_blocked_suspected_mislabel_rows_path: outputs/analysis/hard_row_visual_review/reports/blocked_suspected_mislabel_rows.csv
  spec014_blocked_other_high_risk_rows_path: outputs/analysis/hard_row_visual_review/reports/blocked_other_high_risk_rows.csv

optional_evidence:
