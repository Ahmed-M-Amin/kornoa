experiment:
  name: phase3_controlled_candidate_a
  seed: 42

classifier:
  v2: true
  experiment_name: phase3_controlled_candidate_a
  model_name: efficientnet_b1
  image_size: 384
  num_classes: 2
  batch_size: 4
  epochs: 3
  learning_rate: 0.001
  weight_decay: 0.01
  imbalance_strategy: focal_loss_weighted_sampler
  augmentation_recipe: v2_safe
  hard_example_strategy: oversample
  weighted_sampler: true
  hard_example_source: auto
  split_source: v2b_compatible

data:
  dataset_root: 1st-krones-vision-ai-challenge
  split_source: v2b_compatible

output:
  root: outputs/kaggle_phase3/controlled_phase3

benchmark:
  speed_ceiling_multiplier: 2.0

hard_examples:
  strategy: oversample

phase3_controlled:
  enabled: true
  baseline_name: v2b_locked_baseline
  baseline_checkpoint_path: artifacts/kaggle_v2b_artifacts/kaggle_v2/v2b_effnet_b1/kaggle_v2/models/classifier_best.pth
  locked_baseline_predictions_path: artifacts/kaggle_v2b_artifacts/kaggle_v2/v2b_effnet_b1/kaggle_v2/predictions/val_classifier_predictions.csv
  locked_baseline_threshold_path: artifacts/kaggle_v2b_artifacts/kaggle_v2/v2b_effnet_b1/kaggle_v2/reports/best_threshold.json
  locked_baseline_metrics_path: artifacts/kaggle_v2b_artifacts/kaggle_v2/v2b_effnet_b1/kaggle_v2/reports/classifier_metrics.json
  locked_baseline_runtime_report_path: artifacts/kaggle_v2b_artifacts/kaggle_v2/v2b_effnet_b1/benchmarks/v2b_inference_benchmark.json
  approved_candidate_package_path: outputs/analysis/hard_row_visual_review/reports/phase3_allowed_hard_training_rows.csv
  blocked_roi_pipeline_bug_rows_path: outputs/analysis/hard_row_visual_review/reports/blocked_roi_pipeline_bug_rows.csv
  blocked_suspected_mislabel_rows_path: outputs/analysis/hard_row_visual_review/reports/blocked_suspected_mislabel_rows.csv
  blocked_other_high_risk_rows_path: outputs/analysis/hard_row_visual_review/reports/blocked_other_high_risk_rows.csv
  candidate_hypothesis: Conservative hard-example oversampling improves controlled hard-row recall without a precision collapse.
  candidate_family: efficientnet_b1
  intended_tradeoff: Recover hard false negatives while holding runtime within the V2B-family ceiling.
